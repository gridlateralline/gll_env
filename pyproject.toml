[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gll_env"
authors = [{ name = "ewz - Zurich Municipal Electric Utility"}]
dynamic = ["version"]
license = { file = "LICENSE" }
description = "Multi-agent prosumer grid environment for Jumanji"
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["reinforcement-learning", "python", "jax", "jumanji"]
dependencies = [
    "chex>=0.1.90",
    "hydra-core>=1.3.5",
    "jax==0.5.3",
    "jumanji>=1.1.2",
    "safetensors>=0.8.0",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.5.3"]
tpu = ["jax[tpu]==0.5.3"]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "ty",
    "pytest",
    "pandapower>=3.5.4",
]

[tool.hatch.version]
path = "gll_env/version.py"

[tool.hatch.build.targets.wheel]
packages = ["gll_env"]
exclude = ["**/*_test.py"]

[tool.hatch.build.targets.sdist]
exclude = ["**/*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "N", "W", "RUF", "ANN"]
ignore = [
  "E731", # Allow lambdas to be assigned to variables.
  "ANN204", # no need for return type for special methods
  "ANN401", # can use Any type
  "A002", # Argument shadowing a Python builtin.
  "A003", # Class attribute shadowing a Python builtin.
  "A005", # Module shadowing a Python builtin.
  "B017", # assertRaises(Exception): or pytest.raises(Exception) should be considered evil.
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Ignore `F401` (import violations) in all `__init__.py` files.

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["gll_env"]

[tool.ty.rules]
# Disabled because of JAX/NumPy array typing through chex aliases (`chex.Array`, `chex.Numeric`,
# ...), which resolve to broad unions like `Array | ndarray | numpy.bool | number`. The scalar
# members of those unions are not subscriptable, lack JAX's `.at` accessor and do not support
# array operators, so a static checker reports ~1800 false positives on otherwise-correct array
# code. These are the only rules disabled for the array-typing limitation; re-enable them per-rule
# as the codebase is incrementally annotated with stricter array types.
not-subscriptable = "ignore"
unsupported-operator = "ignore"
not-iterable = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
# Not array-related: jumanji deliberately refines abstract method signatures in subclasses
# (`RewardFn`/`Generator`/`Agent`/`Viewer`/`ParametricDistribution` `__call__`/`step`/`render`/...)
# and narrows `__eq__`/`__add__` on specs and namedtuples. ty flags all 44 intentional overrides
# as incompatible; disabled project-wide rather than suppressed at each of the 44 call sites.
invalid-method-override = "ignore"
